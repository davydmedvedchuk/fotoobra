<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFEBE4">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FotoObra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>FotoObra</title>
<style>
:root{--bg:#EFEBE4;--card:#FFFFFF;--ink:#1B1A17;--muted:#5E5A52;--line:#D9D3C8;--accent:#C2410C;--soft:#F3E6DA;--edge:#B5AD9E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex-shrink:0}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;max-width:760px;margin:0 auto}
.grow{flex:1;min-width:0}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center}
.icon-btn{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.title{font-weight:800;font-size:22px;letter-spacing:-.3px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{padding:4px 16px calc(120px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.proj{display:flex;gap:14px;align-items:center;width:100%;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;text-align:left}
.proj img,.noimg{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#CFC8BB;display:flex;align-items:center;justify-content:center;color:#fff}
.pname{display:block;font-size:17px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:48px 16px;color:var(--muted);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{display:flex;gap:10px;max-width:728px;margin:0 auto}
.btn{height:52px;border-radius:14px;border:none;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;flex:1;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--edge)}
.btn.danger{background:transparent;border:1.5px solid #DC2626;color:#B91C1C}
.btn.sq{flex:0 0 52px;padding:0}
.btn:disabled{opacity:.5}
.group-label{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ph{position:relative;display:flex;flex-direction:column;padding:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#CFC8BB}
.ph .cap{padding:8px 10px 0;margin-bottom:10px;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph .cap.none{color:var(--muted)}
.time{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(27,26,23,.75);color:#fff}
.pick .tick{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pick.off img{opacity:.35}
.pick.off .tick{background:rgba(255,255,255,.92);color:transparent;border-color:var(--edge)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],textarea,select{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
textarea{min-height:92px;resize:vertical;line-height:1.4}
.row{display:flex;gap:8px;align-items:flex-start}
.row>.field{flex:1}
.mic{width:52px;height:52px;border:1.5px solid var(--edge);background:var(--card)}
.mic.rec{background:#DC2626;border-color:#DC2626;color:#fff}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--edge);background:transparent;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.preview-img{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#2B2926;display:block;margin-bottom:16px}
.done{margin-top:16px;padding:14px;border-radius:14px;background:#E7F5E4;font-weight:600;display:flex;gap:8px;align-items:center}
.section{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
h2{font-size:18px;margin:0 0 10px}
.logo-prev{max-height:64px;max-width:220px;display:block;margin:4px 0 10px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.btn-row .btn{flex:1 1 150px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.45;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="logoIn" accept="image/*" hidden>
<input type="file" id="backupIn" accept=".json,application/json" hidden>
<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const fmtDate = ts => { const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear(); };
const fmtTime = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const DAY = 86400000;
function relDay(ts) {
  const t = startOfDay(Date.now()), d = startOfDay(ts);
  if (d === t) return 'сегодня';
  if (d === t - DAY) return 'вчера';
  return fmtDate(ts);
}
const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' МБ';
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9А-Яа-яЁёІіЇїЄєҐґ]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'obra';

const I = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  camera: I('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  gallery: I('<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>'),
  back: I('<path d="M15 6l-6 6 6 6"/>'),
  close: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  gear: I('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  file: I('<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>'),
  mic: I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>', 22),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  pencil: I('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),
  trash: I('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  check: I('<path d="M5 12l5 5 9-10"/>', 16),
  share: I('<path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/>'),
  download: I('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>'),
  home: I('<path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/>', 24),
  chev: I('<path d="M9 6l6 6-6 6"/>', 18)
};

let toastT;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- storage (IndexedDB, only on this phone) ---------- */
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('fotoobra', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('projects', { keyPath: 'id' });
      d.createObjectStore('photos', { keyPath: 'id' }).createIndex('projectId', 'projectId');
      d.createObjectStore('blobs', { keyPath: 'id' });
      d.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(stores, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(stores, mode);
    let out;
    const r = fn(t);
    if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('abort'));
  });
}
const getAll = s => tx(s, 'readonly', t => t.objectStore(s).getAll());
const get = (s, k) => tx(s, 'readonly', t => t.objectStore(s).get(k));
const put = (s, v) => tx(s, 'readwrite', t => t.objectStore(s).put(v));
const byProject = pid => tx('photos', 'readonly', t => t.objectStore('photos').index('projectId').getAll(pid));

const DEFAULTS = { k: 'settings', company: '', line2: '', person: '', logo: null, pdfLang: 'pt', voiceLang: 'ru-RU' };
let settings = { ...DEFAULTS };

const urlCache = new Map();
function thumbUrl(ph) {
  if (!urlCache.has(ph.id)) urlCache.set(ph.id, URL.createObjectURL(new Blob([ph.thumb.buf], { type: ph.thumb.type })));
  return urlCache.get(ph.id);
}
function dropUrl(id) { if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); } }

/* ---------- images ---------- */
async function loadImg(blob) {
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.src = url;
  try { await img.decode(); } catch (e) { await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; }); }
  URL.revokeObjectURL(url);
  return img;
}
async function resize(img, max, q, type = 'image/jpeg') {
  let w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  w = Math.round(w * k); h = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
  x.drawImage(img, 0, 0, w, h);
  const b = await new Promise(r => c.toBlob(r, type, q));
  return { buf: await b.arrayBuffer(), type, w, h };
}

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
const micBtn = id => SR ? `<button class="icon-btn mic" data-act="mic" data-for="${id}" aria-label="Надиктовать">${ICON.mic}</button>` : '';
const micHint = () => SR ? 'Нажми микрофон и скажи, что сделано.' : 'Можно надиктовать через микрофон на клавиатуре.';
function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} } }
function toggleMic(btn) {
  if (rec) { stopMic(); return; }
  const ta = document.getElementById(btn.dataset.for);
  const base = ta.value.trim() ? ta.value.trim() + ' ' : '';
  let fin = '';
  rec = new SR();
  rec.lang = settings.voiceLang; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
    }
    ta.value = base + fin + interim;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = e => { if (e.error !== 'aborted' && e.error !== 'no-speech') toast('Микрофон: ' + e.error); };
  rec.onend = () => { rec = null; btn.classList.remove('rec'); };
  btn.classList.add('rec');
  try { rec.start(); } catch (e) { rec = null; btn.classList.remove('rec'); toast('Микрофон недоступен'); }
}

/* ---------- navigation ---------- */
const S = { view: 'home', pid: null, photoId: null, queue: [], qi: 0, report: null, backupFile: null };
const VIEWS = {};
async function render(v) { stopMic(); S.view = v; await VIEWS[v](); }
function go(v, p = {}) {
  Object.assign(S, p);
  history.pushState({ v, pid: S.pid, photoId: S.photoId }, '');
  window.scrollTo(0, 0);
  render(v);
}
function replace(v, p = {}) {
  Object.assign(S, p);
  history.replaceState({ v, pid: S.pid, photoId: S.photoId }, '');
  window.scrollTo(0, 0);
  render(v);
}
window.addEventListener('popstate', e => {
  const st = e.state || { v: 'home' };
  S.pid = st.pid ?? null; S.photoId = st.photoId ?? null;
  render(st.v);
});
const topBar = (title, sub, left = 'back', right = '') => `
<header class="top">
  ${left === 'back' ? `<button class="icon-btn" data-act="back" aria-label="Назад">${ICON.back}</button>` : left === 'close' ? `<button class="icon-btn" data-act="back" aria-label="Отмена">${ICON.close}</button>` : left}
  <div class="grow"><div class="title">${esc(title)}</div>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>${right}
</header>`;
const bar = inner => `<div class="bar"><div class="bar-in" id="barIn">${inner}</div></div>`;

/* ---------- views ---------- */
VIEWS.home = async () => {
  const [projects, photos] = await Promise.all([getAll('projects'), getAll('photos')]);
  const st = {};
  for (const ph of photos) {
    const s = st[ph.projectId] || (st[ph.projectId] = { n: 0, last: 0, thumb: null });
    s.n++; if (ph.ts >= s.last) { s.last = ph.ts; s.thumb = ph; }
  }
  projects.sort((a, b) => (st[b.id]?.last || b.created) - (st[a.id]?.last || a.created));
  app.innerHTML = topBar('FotoObra', '', `<div class="logo">${ICON.camera}</div>`, `<button class="icon-btn" data-act="settings" aria-label="Настройки">${ICON.gear}</button>`) + `
<main class="wrap">
${projects.length ? projects.map(p => {
    const s = st[p.id];
    return `<button class="proj" data-act="open" data-id="${p.id}">
      ${s ? `<img src="${thumbUrl(s.thumb)}" alt="">` : `<span class="noimg">${ICON.home}</span>`}
      <span class="grow"><span class="pname">${esc(p.name)}</span>${p.addr ? `<span class="sub">${esc(p.addr)}</span>` : ''}<span class="sub">${s ? s.n + ' фото · ' + relDay(s.last) : 'Пока без фото'}</span></span>${ICON.chev}</button>`;
  }).join('') : `<div class="empty"><b>Пока нет объектов</b>Создай первый объект, и фотографируй работу по нему.</div>`}
</main>` + bar(`<button class="btn primary" data-act="newProject">${ICON.plus} Новый объект</button>`);
};

VIEWS.projectForm = async () => {
  const p = S.pid ? await get('projects', S.pid) : null;
  app.innerHTML = topBar(p ? 'Изменить объект' : 'Новый объект', '', 'close') + `
<main class="wrap">
  <div class="field"><label for="pfName">Название</label><input type="text" id="pfName" value="${esc(p?.name)}" placeholder="Например: Moradia Estoril" autocomplete="off"></div>
  <div class="field"><label for="pfAddr">Адрес</label><input type="text" id="pfAddr" value="${esc(p?.addr)}" placeholder="Улица, город" autocomplete="off"></div>
  <div class="field"><label for="pfClient">Клиент</label><input type="text" id="pfClient" value="${esc(p?.client)}" placeholder="Имя или компания" autocomplete="off"></div>
  ${p ? `<div class="section"><button class="btn danger" data-act="deleteProject">${ICON.trash} Удалить объект и все фото</button></div>` : ''}
</main>` + bar(`<button class="btn primary" data-act="saveProject">${ICON.check} Сохранить</button>`);
  if (!p) setTimeout(() => $('#pfName')?.focus(), 50);
};

VIEWS.project = async () => {
  const p = await get('projects', S.pid);
  if (!p) return replace('home', { pid: null });
  const photos = (await byProject(p.id)).sort((a, b) => b.ts - a.ts);
  const groups = [];
  for (const ph of photos) {
    const k = dayKey(ph.ts);
    if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, ts: ph.ts, items: [] });
    groups[groups.length - 1].items.push(ph);
  }
  const label = ts => { const r = relDay(ts); return r === 'сегодня' ? 'Сегодня' : r === 'вчера' ? 'Вчера' : r; };
  app.innerHTML = topBar(p.name, [p.addr, photos.length + ' фото'].filter(Boolean).join(' · '), 'back', `<button class="icon-btn" data-act="editProject" aria-label="Изменить объект">${ICON.pencil}</button>`) + `
<main class="wrap">
${photos.length ? groups.map(g => `<div class="group-label">${esc(label(g.ts))}</div><div class="grid">${g.items.map(ph => `
  <button class="ph" data-act="photo" data-id="${ph.id}"><img src="${thumbUrl(ph)}" alt="" loading="lazy"><span class="time">${fmtTime(ph.ts)}</span>
  <span class="cap ${ph.caption ? '' : 'none'}">${esc(ph.caption || 'Без подписи')}</span></button>`).join('')}</div>`).join('')
    : `<div class="empty"><b>Фото пока нет</b>Нажми «Снять», сфотографируй работу и надиктуй, что сделано.</div>`}
</main>` + bar(`
  <button class="btn primary" data-act="cam">${ICON.camera} Снять</button>
  <button class="btn ghost sq" data-act="gal" aria-label="Добавить из галереи">${ICON.gallery}</button>
  <button class="btn dark" data-act="report">${ICON.file} Отчёт</button>`);
};

VIEWS.add = async () => {
  const f = S.queue[S.qi];
  if (!f) return replace('project');
  if (S.addUrl) URL.revokeObjectURL(S.addUrl);
  S.addUrl = URL.createObjectURL(f);
  const many = S.queue.length > 1;
  app.innerHTML = topBar('Новое фото', many ? `${S.qi + 1} из ${S.queue.length}` : '', 'close') + `
<main class="wrap">

function inRange(ts, R) {
  const t0 = startOfDay(Date.now());
  if (R.range === 'today') return ts >= t0;
  if (R.range === 'week') return ts >= t0 - 6 * DAY;
  if (R.range === 'custom') {
    const a = R.from ? new Date(R.from + 'T00:00').getTime() : 0;
    const b = R.to ? new Date(R.to + 'T00:00').getTime() + DAY : Infinity;
    return ts >= a && ts < b;
  }
  return true;
}

/* ---------- PDF (drawn on canvas, packed without libraries) ---------- */
const LBL = {
  pt: { title: 'Relatório de obra', client: 'Cliente', period: 'Período', person: 'Responsável', date: 'Data', summary: 'Resumo', page: 'Página', of: 'de', file: 'Relatorio' },
  ru: { title: 'Отчёт по объекту', client: 'Клиент', period: 'Период', person: 'Ответственный', date: 'Дата', summary: 'Кратко', page: 'Страница', of: 'из', file: 'Otchet' },
  uk: { title: 'Звіт по об’єкту', client: 'Клієнт', period: 'Період', person: 'Відповідальний', date: 'Дата', summary: 'Коротко', page: 'Сторінка', of: 'з', file: 'Zvit' }
};
function buildPdf(pages) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : new Uint8Array(x); parts.push(b); len += b.length; };
  const obj = (id, body) => { offs[id] = len; push(id + ' 0 obj\n'); body(); push('\nendobj\n'); };
  const PW = 595.28, PH = 841.89, n = pages.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`));
  pages.forEach((p, i) => {
    const pid = 3 + 3 * i, cid = pid + 1, iid = pid + 2;
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(cid, () => { push(`<< /Length ${cs.length} >>\nstream\n`); push(cs); push('\nendstream'); });
    obj(iid, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.buf.byteLength} >>\nstream\n`); push(p.buf); push('\nendstream'); });
  });
  const xref = len, total = 3 + 3 * n;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x);
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function makeReportPdf(project, photos, summary) {
  const L = LBL[settings.pdfLang] || LBL.pt;
  const W = 1240, H = 1754, M = 90, ACC = '#C2410C', INK = '#1B1A17', MUT = '#5E5A52';
  const F = (px, w = 400) => `${w} ${px}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;
  const pages = [];
  let c, x, y;
  const newPage = () => {
    c = document.createElement('canvas'); c.width = W; c.height = H;
    x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.textBaseline = 'alphabetic';
    pages.push(c); y = M;
    if (pages.length > 1) { x.fillStyle = MUT; x.font = F(22); x.fillText(clip(project.name + ' · ' + L.title, W - 2 * M), M, y + 22); y += 56; }
  };
  const clip = (t, maxW) => { t = String(t); if (x.measureText(t).width <= maxW) return t; while (t.length && x.measureText(t + '…').width > maxW) t = t.slice(0, -1); return t + '…'; };
  const wrap = (text, maxW, maxLines) => {
    const out = [];
    for (const para of String(text).split(/\n/)) {
      let line = '';
      for (const w of para.split(/\s+/).filter(Boolean)) {
        const t = line ? line + ' ' + w : w;
        if (x.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
      }
      if (line) out.push(line);
    }
    if (maxLines && out.length > maxLines) { const o = out.slice(0, maxLines); o[maxLines - 1] = clip(o[maxLines - 1] + '…', maxW); return o; }
    return out.map(l => clip(l, maxW));
  };
  newPage();
  /* header */
  let hx = M;
  if (settings.logo) {
    try {
      const lg = await loadImg(new Blob([settings.logo.buf], { type: settings.logo.type }));
      const s = Math.min(96 / lg.naturalHeight, 240 / lg.naturalWidth);
      const lw = lg.naturalWidth * s, lh = lg.naturalHeight * s;
      x.drawImage(lg, hx, y + (96 - lh) / 2, lw, lh); hx += lw + 26;
    } catch (e) {}
  }
  const dateTxt = fmtDate(Date.now());
  x.font = F(28, 600); const dw = x.measureText(dateTxt).width;
  x.fillStyle = INK; x.font = F(30, 600); x.fillText(clip(settings.company || '', W - M - hx - dw - 40), hx, y + 42);
  x.fillStyle = MUT; x.font = F(22); x.fillText(clip(settings.line2 || '', W - M - hx - dw - 40), hx, y + 78);
  x.textAlign = 'right'; x.fillStyle = MUT; x.font = F(22); x.fillText(L.date, W - M, y + 38);
  x.fillStyle = INK; x.font = F(28, 600); x.fillText(dateTxt, W - M, y + 76); x.textAlign = 'left';
  y += 118; x.fillStyle = ACC; x.fillRect(M, y, W - 2 * M, 5); y += 50;
  x.fillStyle = INK; x.font = F(58, 800); x.fillText(L.title, M, y + 52); y += 84;
  x.fillStyle = '#3D3A34'; x.font = F(28); x.fillText(clip([project.name, project.addr].filter(Boolean).join(' · '), W - 2 * M), M, y + 28); y += 58;
  /* info boxes */
  const t0 = Math.min(...photos.map(p => p.ts)), t1 = Math.max(...photos.map(p => p.ts));
  const period = dayKey(t0) === dayKey(t1) ? fmtDate(t0) : fmtDate(t0) + ' – ' + fmtDate(t1);
  const boxes = [[L.client, project.client || '—'], [L.period, period], [L.person, settings.person || '—']];
  const bw = (W - 2 * M - 2 * 24) / 3;
  boxes.forEach(([k, v], i) => {
    const bx = M + i * (bw + 24);
    x.fillStyle = '#F5F2EC'; x.fillRect(bx, y, bw, 104);
    x.fillStyle = MUT; x.font = F(20); x.fillText(k, bx + 22, y + 38);
    x.fillStyle = INK; x.font = F(26, 600); x.fillText(clip(v, bw - 44), bx + 22, y + 78);
  });
  y += 104 + 44;
  /* summary */
  if (summary.trim()) {
    x.fillStyle = MUT; x.font = F(20, 600); x.fillText(L.summary.toUpperCase(), M, y + 20); y += 40;
    x.fillStyle = INK; x.font = F(26);
    for (const line of wrap(summary.trim(), W - 2 * M, 8)) { x.fillText(line, M, y + 28); y += 40; }
    y += 30;
  }
  /* photos, 2 per row */
  const gap = 36, cw = (W - 2 * M - gap) / 2, ih = Math.round(cw * 0.66), capLines = 3, cellH = ih + 24 + capLines * 32 + 20;
  const bottom = H - M - 40;
  let col = 0;
  for (const ph of photos) {
    if (col === 0 && y + cellH > bottom) newPage();
    const cx = M + col * (cw + gap);
    x.fillStyle = '#F2EFEA'; x.fillRect(cx, y, cw, ih);
    try {
      const full = await get('blobs', ph.id);
      const img = await loadImg(new Blob([full ? full.buf : ph.thumb.buf], { type: 'image/jpeg' }));
      const s = Math.min(cw / img.naturalWidth, ih / img.naturalHeight);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      x.drawImage(img, cx + (cw - w) / 2, y + (ih - h) / 2, w, h);
    } catch (e) {}
    let ty = y + ih + 34;
    x.font = F(22, 700); x.fillStyle = INK;
    const stamp = fmtDate(ph.ts) + ' ' + fmtTime(ph.ts);
    x.fillText(stamp, cx, ty);
    x.font = F(22); x.fillStyle = '#3D3A34';
    for (const line of wrap(ph.caption || '', cw, capLines)) { ty += 32; x.fillText(line, cx, ty); }
    col++; if (col === 2) { col = 0; y += cellH; }
  }
  /* footers */
  pages.forEach((pg, i) => {
    const g = pg.getContext('2d');
    g.fillStyle = '#E5E0D6'; g.fillRect(M, H - M + 6, W - 2 * M, 2);
    g.fillStyle = MUT; g.font = F(20);
    g.fillText(settings.company || 'FotoObra', M, H - M + 40);
    g.textAlign = 'right'; g.fillText(`${L.page} ${i + 1} ${L.of} ${pages.length}`, W - M, H - M + 40); g.textAlign = 'left';
  });
  const jpgs = [];
  for (const pg of pages) {
    const b = await new Promise(r => pg.toBlob(r, 'image/jpeg', 0.86));
    jpgs.push({ buf: await b.arrayBuffer(), w: W, h: H });
    pg.width = pg.height = 1;
  }
  const name = `${L.file}_${slug(project.name)}_${dayKey(Date.now())}.pdf`;
  return { file: new File([buildPdf(jpgs)], name, { type: 'application/pdf' }), pages: pages.length };
}

function download(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
async function shareFile(file, title) {
  try { await navigator.share({ files: [file], title }); }
  catch (e) { if (e.name !== 'AbortError') download(file); }
}

/* ---------- backup ---------- */
function toB64(buf) {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
const packBin = o => o && o.buf ? { type: o.type, w: o.w, h: o.h, b64: toB64(o.buf) } : o;
const unpackBin = o => o && o.b64 ? { type: o.type, w: o.w, h: o.h, buf: fromB64(o.b64) } : o;
async function makeBackup() {
  const [projects, photos, blobs, kv] = await Promise.all([getAll('projects'), getAll('photos'), getAll('blobs'), getAll('kv')]);
  const parts = ['{"app":"fotoobra","v":1,"at":' + JSON.stringify(new Date().toISOString()),
    ',"projects":' + JSON.stringify(projects),
    ',"photos":' + JSON.stringify(photos.map(p => ({ ...p, thumb: packBin(p.thumb) }))),
    ',"kv":' + JSON.stringify(kv.map(k => ({ ...k, logo: packBin(k.logo) }))), ',"blobs":['];
  blobs.forEach((b, i) => parts.push((i ? ',' : '') + JSON.stringify({ id: b.id, ...packBin(b) })));
  parts.push(']}');
  return new File(parts, `fotoobra-backup-${dayKey(Date.now())}.json`, { type: 'application/json' });
}
async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast('Это не файл копии FotoObra'); }
  if (data.app !== 'fotoobra') return toast('Это не файл копии FotoObra');
  if (!confirm(`Восстановить ${data.projects.length} объектов и ${data.photos.length} фото? Совпадающие записи будут заменены.`)) return;
  await tx(['projects', 'photos', 'blobs', 'kv'], 'readwrite', t => {
    data.projects.forEach(p => t.objectStore('projects').put(p));
    data.photos.forEach(p => t.objectStore('photos').put({ ...p, thumb: unpackBin(p.thumb) }));
    data.blobs.forEach(b => { const u = unpackBin(b); t.objectStore('blobs').put({ id: b.id, buf: u.buf, type: u.type, w: u.w, h: u.h }); });
    data.kv.forEach(k => t.objectStore('kv').put({ ...k, logo: unpackBin(k.logo) }));
  });
  settings = { ...DEFAULTS, ...((await get('kv', 'settings')) || {}) };
  toast('Копия восстановлена');
  replace('home');
}

const ACT = {

    });
    toast('Объект удалён');
    replace('home', { pid: null });
  },
  cam: () => $('#camIn').click(),
  gal: () => $('#galIn').click(),
  photo: b => go('photo', { photoId: b.dataset.id }),
  report: () => { S.report = null; go('report'); },
  mic: b => toggleMic(b),
  skip: () => { S.qi++; S.qi < S.queue.length ? render('add') : history.back(); },
  savePhoto: b => busy(b, 'Сохраняю…', async () => {
    stopMic();
    const f = S.queue[S.qi];
    const img = await loadImg(f);
    const full = await resize(img, 1600, 0.82);
    const thumb = await resize(img, 480, 0.72);
    const id = uid();
    const ts = f.lastModified && f.lastModified <= Date.now() ? f.lastModified : Date.now();
    await tx(['photos', 'blobs'], 'readwrite', t => {
      t.objectStore('photos').put({ id, projectId: S.pid, ts, caption: $('#cap').value.trim(), thumb });
      t.objectStore('blobs').put({ id, ...full });
    });
    try { navigator.storage?.persist?.(); } catch (e) {}
    S.qi++;
    if (S.qi < S.queue.length) { toast('Сохранено'); render('add'); }
    else { S.queue = []; toast('Фото сохранено'); history.back(); }
  }),
  updatePhoto: async () => {
    stopMic();
    const ph = await get('photos', S.photoId);
    ph.caption = $('#cap').value.trim();
    await put('photos', ph);
    toast('Сохранено'); history.back();
  },
  deletePhoto: async () => {
    if (!confirm('Удалить это фото?')) return;
    const id = S.photoId;
    await tx(['photos', 'blobs'], 'readwrite', t => { t.objectStore('photos').delete(id); t.objectStore('blobs').delete(id); });
    dropUrl(id); toast('Фото удалено'); history.back();
  },
  range: b => { const R = S.report; R.range = b.dataset.range; R.pdf = null; render('report'); },
  pick: b => { const R = S.report, id = b.dataset.id; R.excluded.has(id) ? R.excluded.delete(id) : R.excluded.add(id); R.pdf = null; render('report'); },
  makePdf: b => busy(b, 'Создаю PDF…', async () => {
    stopMic();
    const R = S.report;
    const p = await get('projects', S.pid);
    const list = (await byProject(p.id)).sort((a, c) => a.ts - c.ts).filter(x => inRange(x.ts, R) && !R.excluded.has(x.id));
    if (!list.length) return toast('Нет фото для отчёта');
    const out = await makeReportPdf(p, list, R.summary);
    R.pdf = out.file; R.pdfPages = out.pages;
    const y = window.scrollY; await render('report'); window.scrollTo(0, y);
  }),
  sharePdf: async () => { const p = await get('projects', S.pid); shareFile(S.report.pdf, p.name); },
  dlPdf: () => download(S.report.pdf),
  logo: () => { readSettingsFields(); $('#logoIn').click(); },
  logoDel: async () => { readSettingsFields(); settings.logo = null; await put('kv', settings); render('settings'); },
  saveSettings: async () => { readSettingsFields(); await put('kv', settings); toast('Настройки сохранены'); },
  backup: b => busy(b, 'Готовлю копию…', async () => { S.backupFile = await makeBackup(); readSettingsFields(); await render('settings'); window.scrollTo(0, document.body.scrollHeight); }),
  shareBackup: () => shareFile(S.backupFile, 'FotoObra — резервная копия'),
  dlBackup: () => download(S.backupFile),
  restore: () => $('#backupIn').click()
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
app.addEventListener('input', e => {
  if (e.target.id === 'summary' && S.report) {
    S.report.summary = e.target.value;
    if (S.report.pdf) { S.report.pdf = null; $('.done')?.remove(); $('#barIn').innerHTML = reportBar(); }
  }
});
app.addEventListener('change', e => {
  if ((e.target.id === 'dFrom' || e.target.id === 'dTo') && S.report) {
    S.report[e.target.id === 'dFrom' ? 'from' : 'to'] = e.target.value; S.report.pdf = null; render('report');
  }
});
const onFiles = input => {
  const files = [...input.files]; input.value = '';
  if (files.length) go('add', { queue: files, qi: 0 });
};
$('#camIn').addEventListener('change', e => onFiles(e.target));
$('#galIn').addEventListener('change', e => onFiles(e.target));
$('#logoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { settings.logo = await resize(await loadImg(f), 480, 0.92, 'image/png'); await put('kv', settings); render('settings'); }
  catch (err) { toast('Не получилось открыть картинку'); }
});
$('#backupIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); });

/* ---------- start ---------- */
(async () => {
  try { settings = { ...DEFAULTS, ...((await get('kv', 'settings')) || {}) }; } catch (e) {}
  history.replaceState({ v: 'home' }, '');
  render('home');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
