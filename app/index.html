<title>FotoObra</title>
<style>
:root{--bg:#F4F5F7;--card:#FFFFFF;--ink:#14202B;--muted:#5B6672;--line:#DFE3E8;--brand:#17324D;--brand2:#22476B;--accent:#FFB400;--accent-ink:#14202B;--soft:#FFF4D6;--sky:#E6EEF6;--edge:#AEB6C0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
svg{flex-shrink:0}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;margin-bottom:12px}
.top-in{display:flex;align-items:center;gap:10px;max-width:728px;margin:0 auto}
.top .icon-btn{background:rgba(255,255,255,.12);color:#fff}
.top .sub{color:#C9D6E3}
.grow{flex:1;min-width:0}
.logo{width:36px;height:36px;border-radius:9px;display:block}
.icon-btn{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.title{font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:24px;letter-spacing:.2px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{padding:4px 16px calc(120px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.proj{display:flex;gap:14px;align-items:center;width:100%;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;text-align:left}
.proj img,.noimg{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--brand2)}
.pname{display:block;font-size:17px;font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:48px 16px;color:var(--muted);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar-in{display:flex;gap:10px;max-width:728px;margin:0 auto}
.btn{height:52px;border-radius:14px;border:none;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;flex:1;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--edge)}
.btn.danger{background:transparent;border:1.5px solid #DC2626;color:#B91C1C}
.btn.sq{flex:0 0 52px;padding:0}
.btn:disabled{opacity:.5}
.group-label{display:flex;align-items:center;gap:8px;font-family:Oswald,Inter,sans-serif;font-size:14px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--brand2);margin:18px 0 10px}
.group-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ph{position:relative;display:flex;flex-direction:column;padding:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--sky)}
.ph .cap{padding:8px 10px 0;margin-bottom:10px;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph .cap.none{color:var(--muted)}
.time{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(23,50,77,.85);color:#fff}
.pick .tick{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pick.off img{opacity:.35}
.pick.off .tick{background:rgba(255,255,255,.92);color:transparent;border-color:var(--edge)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],textarea,select{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
textarea{min-height:92px;resize:vertical;line-height:1.4}
.row{display:flex;gap:8px;align-items:flex-start}
.row>.field{flex:1}
.mic{width:52px;height:52px;border:1.5px solid var(--edge);background:var(--card)}
.mic.rec{background:#DC2626;border-color:#DC2626;color:#fff}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--edge);background:transparent;font-size:14px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.preview-img{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#1C2630;display:block;margin-bottom:16px}
.done{margin-top:16px;padding:14px;border-radius:14px;background:#E7F5E4;font-weight:600;display:flex;gap:8px;align-items:center}
.section{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
h2{font-family:Oswald,Inter,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:20px;margin:0 0 10px}
.logo-prev{max-height:64px;max-width:220px;display:block;margin:4px 0 10px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.btn-row .btn{flex:1 1 150px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;line-height:1.45;font-size:14px}
.card.note{background:var(--soft);border-color:#F2DA94}
.welcome{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.welcome h3{margin:0 0 4px;font-family:Oswald,Inter,sans-serif;font-weight:700;text-transform:uppercase;font-size:24px;letter-spacing:.3px}
.welcome>p{margin:0 0 10px;color:var(--muted);font-size:14px}
.ws{display:flex;gap:12px;align-items:center;padding:11px 0;font-size:15px;border-top:1px solid var(--line)}
.ws i{font-style:normal;flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.sample-btns{display:flex;gap:8px;margin-top:12px}
.sample-btns .btn{height:46px;font-size:15px}
.sample-btns .btn.sq{flex:0 0 46px}
.linkrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:15px;font-weight:600;text-align:left;text-decoration:none;margin-bottom:10px}
.linkrow svg{color:var(--brand2)}
details.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;font-size:14px;line-height:1.45}
details.qa summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:"+";margin-left:auto;font-size:20px;font-weight:500;color:var(--brand2)}
details.qa[open] summary::after{content:"–"}
details.qa .a{padding:0 14px 14px;color:#3D4650}
</style>
</head>

/* ---------- storage (IndexedDB, only on this phone) ---------- */
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open('fotoobra', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('projects', { keyPath: 'id' });
      d.createObjectStore('photos', { keyPath: 'id' }).createIndex('projectId', 'projectId');
      d.createObjectStore('blobs', { keyPath: 'id' });
      d.createObjectStore('kv', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(stores, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tr = d.transaction(stores, mode);
    let out;
    const r = fn(tr);
    if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
    tr.oncomplete = () => res(out);
    tr.onerror = () => rej(tr.error);
    tr.onabort = () => rej(tr.error || new Error('abort'));
  });
}
const getAll = s => tx(s, 'readonly', tr => tr.objectStore(s).getAll());
const get = (s, k) => tx(s, 'readonly', tr => tr.objectStore(s).get(k));
const put = (s, v) => tx(s, 'readwrite', tr => tr.objectStore(s).put(v));

/* ---------- images ---------- */
async function loadImg(blob) {
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.src = url;
  try { await img.decode(); } catch (e) { await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; }); }
  URL.revokeObjectURL(url);
  return img;
}
async function resize(img, max, q, type = 'image/jpeg') {
  let w = img.naturalWidth, h = img.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  w = Math.round(w * k); h = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); }
  x.drawImage(img, 0, 0, w, h);
  const b = await new Promise(r => c.toBlob(r, type, q));
  return { buf: await b.arrayBuffer(), type, w, h };
}

function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} } }
function toggleMic(btn) {
  if (rec) { stopMic(); return; }
  const ta = document.getElementById(btn.dataset.for);
  const base = ta.value.trim() ? ta.value.trim() + ' ' : '';
  let fin = '';
  rec = new SR();
  rec.lang = settings.voiceLang; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript;
    }
    ta.value = base + fin + interim;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  };
  rec.onerror = e => { if (e.error !== 'aborted' && e.error !== 'no-speech') toast(t('micErr', e.error)); };
  rec.onend = () => { rec = null; btn.classList.remove('rec'); };
  btn.classList.add('rec');
  try { rec.start(); } catch (e) { rec = null; btn.classList.remove('rec'); toast(t('micNone')); }
}

function inRange(ts, R) {
  const t0 = startOfDay(Date.now());
  if (R.range === 'today') return ts >= t0;
  if (R.range === 'week') return ts >= t0 - 6 * DAY;
  if (R.range === 'custom') {
    const a = R.from ? new Date(R.from + 'T00:00').getTime() : 0;
    const b = R.to ? new Date(R.to + 'T00:00').getTime() + DAY : Infinity;
    return ts >= a && ts < b;
  }
  return true;
}
function reportBar() {
  const R = S.report;

    const canShare = navigator.canShare && navigator.canShare({ files: [R.pdf] });

/* ---------- PDF (drawn on canvas, packed without libraries) ---------- */
const LBL = {
  pt: { title: 'Relatório de obra', client: 'Cliente', period: 'Período', person: 'Responsável', date: 'Data', summary: 'Resumo', page: 'Página', of: 'de', file: 'Relatorio' },
  ru: { title: 'Отчёт по объекту', client: 'Клиент', period: 'Период', person: 'Ответственный', date: 'Дата', summary: 'Кратко', page: 'Страница', of: 'из', file: 'Otchet' },
  uk: { title: 'Звіт по об’єкту', client: 'Клієнт', period: 'Період', person: 'Відповідальний', date: 'Дата', summary: 'Коротко', page: 'Сторінка', of: 'з', file: 'Zvit' },
  en: { title: 'Site report', client: 'Client', period: 'Period', person: 'Responsible', date: 'Date', summary: 'Summary', page: 'Page', of: 'of', file: 'Report' }
};
function buildPdf(pages) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : new Uint8Array(x); parts.push(b); len += b.length; };
  const obj = (id, body) => { offs[id] = len; push(id + ' 0 obj\n'); body(); push('\nendobj\n'); };
  const PW = 595.28, PH = 841.89, n = pages.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => (3 + 3 * i) + ' 0 R').join(' ')}] /Count ${n} >>`));
  pages.forEach((p, i) => {
    const pid = 3 + 3 * i, cid = pid + 1, iid = pid + 2;
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(cid, () => { push(`<< /Length ${cs.length} >>\nstream\n`); push(cs); push('\nendstream'); });
    obj(iid, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.buf.byteLength} >>\nstream\n`); push(p.buf); push('\nendstream'); });
  });
  const xref = len, total = 3 + 3 * n;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x);
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}
async function makeReportPdf(project, photos, summary, cfg = settings) {
  const L = LBL[cfg.pdfLang] || LBL.en;
  const W = 1240, H = 1754, M = 90, ACC = '#FFB400', BRAND = '#17324D', INK = '#14202B', MUT = '#5B6672';
  const F = (px, w = 400) => `${w} ${px}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;
  const pages = [];
  let c, x, y;
  const newPage = () => {
    c = document.createElement('canvas'); c.width = W; c.height = H;
    x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.textBaseline = 'alphabetic';
    pages.push(c); y = M;
    if (pages.length > 1) { x.fillStyle = MUT; x.font = F(22); x.fillText(clip(project.name + ' · ' + L.title, W - 2 * M), M, y + 22); y += 56; }
  };
  const clip = (s, maxW) => { s = String(s); if (x.measureText(s).width <= maxW) return s; while (s.length && x.measureText(s + '…').width > maxW) s = s.slice(0, -1); return s + '…'; };
  const wrap = (text, maxW, maxLines) => {
    const out = [];
    for (const para of String(text).split(/\n/)) {
      let line = '';
      for (const w of para.split(/\s+/).filter(Boolean)) {
        const s = line ? line + ' ' + w : w;
        if (x.measureText(s).width > maxW && line) { out.push(line); line = w; } else line = s;
      }
      if (line) out.push(line);
    }
    if (maxLines && out.length > maxLines) { const o = out.slice(0, maxLines); o[maxLines - 1] = clip(o[maxLines - 1] + '…', maxW); return o; }
    return out.map(l => clip(l, maxW));
  };
  newPage();
  /* header */
  let hx = M;
  if (cfg.logo) {
    try {
      const lg = await loadImg(new Blob([cfg.logo.buf], { type: cfg.logo.type }));
      const s = Math.min(96 / lg.naturalHeight, 240 / lg.naturalWidth);
      const lw = lg.naturalWidth * s, lh = lg.naturalHeight * s;
      x.drawImage(lg, hx, y + (96 - lh) / 2, lw, lh); hx += lw + 26;
    } catch (e) {}
  }
  const dateTxt = fmtDate(Date.now());
  x.font = F(28, 600); const dw = x.measureText(dateTxt).width;
  x.fillStyle = INK; x.font = F(30, 600); x.fillText(clip(cfg.company || '', W - M - hx - dw - 40), hx, y + 42);
  x.fillStyle = MUT; x.font = F(22); x.fillText(clip(cfg.line2 || '', W - M - hx - dw - 40), hx, y + 78);
  x.textAlign = 'right'; x.fillStyle = MUT; x.font = F(22); x.fillText(L.date, W - M, y + 38);
  x.fillStyle = INK; x.font = F(28, 600); x.fillText(dateTxt, W - M, y + 76); x.textAlign = 'left';
  y += 118; x.fillStyle = ACC; x.fillRect(M, y, W - 2 * M, 5); y += 50;
  x.fillStyle = BRAND; x.font = F(58, 800); x.fillText(L.title, M, y + 52); y += 84;
  x.fillStyle = '#3D4650'; x.font = F(28); x.fillText(clip([project.name, project.addr].filter(Boolean).join(' · '), W - 2 * M), M, y + 28); y += 58;
  /* info boxes */
  const t0 = Math.min(...photos.map(p => p.ts)), t1 = Math.max(...photos.map(p => p.ts));
  const period = dayKey(t0) === dayKey(t1) ? fmtDate(t0) : fmtDate(t0) + ' – ' + fmtDate(t1);
  const boxes = [[L.client, project.client || '—'], [L.period, period], [L.person, cfg.person || '—']];
  const bw = (W - 2 * M - 2 * 24) / 3;
  boxes.forEach(([k, v], i) => {
    const bx = M + i * (bw + 24);
    x.fillStyle = '#EEF3F8'; x.fillRect(bx, y, bw, 104); x.fillStyle = ACC; x.fillRect(bx, y, 6, 104);
    x.fillStyle = MUT; x.font = F(20); x.fillText(k, bx + 22, y + 38);
    x.fillStyle = INK; x.font = F(26, 600); x.fillText(clip(v, bw - 44), bx + 22, y + 78);
  });
  y += 104 + 44;
  /* summary */
  if (summary.trim()) {
    x.fillStyle = MUT; x.font = F(20, 600); x.fillText(L.summary.toUpperCase(), M, y + 20); y += 40;
    x.fillStyle = INK; x.font = F(26);
    for (const line of wrap(summary.trim(), W - 2 * M, 8)) { x.fillText(line, M, y + 28); y += 40; }
    y += 30;
  }
  /* photos, 2 per row; portrait shots keep their shape instead of shrinking to a strip */
  const gap = 36, cw = (W - 2 * M - gap) / 2, capLines = 3, capH = 24 + capLines * 32 + 20;
  const bottom = H - M - 40;
  const loadPhoto = async ph => {
    try {
      const full = ph.full || await get('blobs', ph.id);
      return await loadImg(new Blob([full ? full.buf : ph.thumb.buf], { type: 'image/jpeg' }));
    } catch (e) { return null; }
  };
  for (let i = 0; i < photos.length; i += 2) {
    const row = photos.slice(i, i + 2);
    const imgs = await Promise.all(row.map(loadPhoto));
    /* each photo fits a cw × cw box at most; the row is as tall as its tallest photo */
    const sizes = imgs.map(im => { if (!im) return [cw, Math.round(cw * 0.66)]; const s = Math.min(cw / im.naturalWidth, cw / im.naturalHeight); return [im.naturalWidth * s, Math.round(im.naturalHeight * s)]; });
    const ih = Math.max(...sizes.map(z => z[1]));
    if (y + ih + capH > bottom) newPage();
    row.forEach((ph, col) => {
      const cx = M + col * (cw + gap), im = imgs[col], [w, h] = sizes[col];
      if (im) x.drawImage(im, cx + (cw - w) / 2, y, w, h);
      else { x.fillStyle = '#EEF1F4'; x.fillRect(cx, y, w, h); }
      let ty = y + h + 34;
      x.font = F(22, 700); x.fillStyle = INK;
      x.fillText(fmtDate(ph.ts) + ' ' + fmtTime(ph.ts), cx, ty);
      x.font = F(22); x.fillStyle = '#3D4650';
      for (const line of wrap(ph.caption || '', cw, capLines)) { ty += 32; x.fillText(line, cx, ty); }
    });
    y += ih + capH;
  }
  /* footers */
  pages.forEach((pg, i) => {
    const g = pg.getContext('2d');
    g.fillStyle = '#E3E7EC'; g.fillRect(M, H - M + 6, W - 2 * M, 2);
    g.fillStyle = MUT; g.font = F(20);
    g.fillText(cfg.company || 'FotoObra', M, H - M + 40);
    g.textAlign = 'right'; g.fillText(`${L.page} ${i + 1} ${L.of} ${pages.length}`, W - M, H - M + 40); g.textAlign = 'left';
  });
  const jpgs = [];
  for (const pg of pages) {
    const b = await new Promise(r => pg.toBlob(r, 'image/jpeg', 0.86));
    jpgs.push({ buf: await b.arrayBuffer(), w: W, h: H });
    pg.width = pg.height = 1;
  }
  const name = `${L.file}_${slug(project.name)}_${dayKey(Date.now())}.pdf`;
  return { file: new File([buildPdf(jpgs)], name, { type: 'application/pdf' }), pages: pages.length };
}

function download(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
async function shareFile(file, title) {
  try { await navigator.share({ files: [file], title }); }
  catch (e) { if (e.name !== 'AbortError') download(file); }
}

/* ---------- backup ---------- */
function toB64(buf) {
  const u = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
const packBin = o => o && o.buf ? { type: o.type, w: o.w, h: o.h, b64: toB64(o.buf) } : o;
const unpackBin = o => o && o.b64 ? { type: o.type, w: o.w, h: o.h, buf: fromB64(o.b64) } : o;
async function makeBackup() {
  const [projects, photos, blobs, kv] = await Promise.all([getAll('projects'), getAll('photos'), getAll('blobs'), getAll('kv')]);
  const parts = ['{"app":"fotoobra","v":1,"at":' + JSON.stringify(new Date().toISOString()),
    ',"projects":' + JSON.stringify(projects),
    ',"photos":' + JSON.stringify(photos.map(p => ({ ...p, thumb: packBin(p.thumb) }))),
    ',"kv":' + JSON.stringify(kv.map(k => ({ ...k, logo: packBin(k.logo) }))), ',"blobs":['];
  blobs.forEach((b, i) => parts.push((i ? ',' : '') + JSON.stringify({ id: b.id, ...packBin(b) })));
  parts.push(']}');
  return new File(parts, `fotoobra-backup-${dayKey(Date.now())}.json`, { type: 'application/json' });
}
async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { return toast(t('notBackup')); }
  if (data.app !== 'fotoobra') return toast(t('notBackup'));
  if (!confirm(t('confirmRestore', data.projects.length, data.photos.length))) return;
  await tx(['projects', 'photos', 'blobs', 'kv'], 'readwrite', tr => {
    data.projects.forEach(p => tr.objectStore('projects').put(p));
    data.photos.forEach(p => tr.objectStore('photos').put({ ...p, thumb: unpackBin(p.thumb) }));
    data.blobs.forEach(b => { const u = unpackBin(b); tr.objectStore('blobs').put({ id: b.id, buf: u.buf, type: u.type, w: u.w, h: u.h }); });
    data.kv.forEach(k => tr.objectStore('kv').put({ ...k, logo: unpackBin(k.logo) }));
  });
  settings = { ...DEFAULTS, ...((await get('kv', 'settings')) || {}) };
  toast(t('restored'));
  replace('home');
}

/* ---------- actions ---------- */
function readSettingsFields() {
  if (!$('#sCompany')) return;
  settings.company = $('#sCompany').value.trim();
  settings.line2 = $('#sLine2').value.trim();
  settings.person = $('#sPerson').value.trim();
  settings.pdfLang = $('#sPdfLang').value;
  settings.voiceLang = $('#sVoice').value;
}
async function busy(btn, text, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = text;
  try { await fn(); } catch (e) { console.error(e); toast(t('error', e.message || e)); btn.disabled = false; btn.innerHTML = old; }
}
const ACT = {
  back: () => history.back(),
  settings: () => go('settings'),
  help: () => go('help'),
  open: b => go('project', { pid: b.dataset.id }),
  newProject: () => go('projectForm', { pid: null }),
  editProject: () => go('projectForm'),
  saveProject: async () => {
    const name = $('#pfName').value.trim();
    if (!name) { $('#pfName').focus(); return toast(t('needName')); }
    const old = S.pid ? await get('projects', S.pid) : null;
    const p = { ...(old || { id: uid(), created: Date.now() }), name, addr: $('#pfAddr').value.trim(), client: $('#pfClient').value.trim() };
    await put('projects', p);
    if (old) history.back(); else replace('project', { pid: p.id });
  },
  deleteProject: async () => {
    const p = await get('projects', S.pid);
    if (!confirm(t('confirmDelJob', p.name))) return;
    const photos = await byProject(p.id);
    await tx(['projects', 'photos', 'blobs'], 'readwrite', tr => {
      photos.forEach(ph => { tr.objectStore('photos').delete(ph.id); tr.objectStore('blobs').delete(ph.id); dropUrl(ph.id); });
      tr.objectStore('projects').delete(p.id);
    });
    toast(t('jobDeleted'));
    replace('home', { pid: null });
  },
  cam: () => $('#camIn').click(),
  gal: () => $('#galIn').click(),
  photo: b => go('photo', { photoId: b.dataset.id }),
  report: () => { S.report = null; go('report'); },
  mic: b => toggleMic(b),
  skip: () => { S.qi++; S.qi < S.queue.length ? render('add') : history.back(); },
  savePhoto: b => busy(b, t('saving'), async () => {
    stopMic();
    const f = S.queue[S.qi];
    const img = await loadImg(f);
    const full = await resize(img, 1600, 0.82);
    const thumb = await resize(img, 480, 0.72);
    const id = uid();
    const ts = f.lastModified && f.lastModified <= Date.now() ? f.lastModified : Date.now();
    await tx(['photos', 'blobs'], 'readwrite', tr => {
      tr.objectStore('photos').put({ id, projectId: S.pid, ts, caption: $('#cap').value.trim(), thumb });
      tr.objectStore('blobs').put({ id, ...full });
    });
    try { navigator.storage?.persist?.(); } catch (e) {}
    S.qi++;
    if (S.qi < S.queue.length) { toast(t('saved')); render('add'); }
    else { S.queue = []; toast(t('photoSaved')); history.back(); }
  }),
  updatePhoto: async () => {
    stopMic();
    const ph = await get('photos', S.photoId);
    ph.caption = $('#cap').value.trim();
    await put('photos', ph);
    toast(t('saved')); history.back();
  },
  deletePhoto: async () => {
    if (!confirm(t('confirmDelPhoto'))) return;
    const id = S.photoId;
    await tx(['photos', 'blobs'], 'readwrite', tr => { tr.objectStore('photos').delete(id); tr.objectStore('blobs').delete(id); });
    dropUrl(id); toast(t('photoDeleted')); history.back();
  },
  range: b => { const R = S.report; R.range = b.dataset.range; R.pdf = null; render('report'); },
  pick: b => { const R = S.report, id = b.dataset.id; R.excluded.has(id) ? R.excluded.delete(id) : R.excluded.add(id); R.pdf = null; render('report'); },
  makePdf: b => busy(b, t('creatingPdf'), async () => {
    stopMic();
    const R = S.report;
    const p = await get('projects', S.pid);
    const list = (await byProject(p.id)).sort((a, c) => a.ts - c.ts).filter(x => inRange(x.ts, R) && !R.excluded.has(x.id));
    if (!list.length) return toast(t('noReportPhotos'));
    const out = await makeReportPdf(p, list, R.summary);
    R.pdf = out.file; R.pdfPages = out.pages;
    const y = window.scrollY; await render('report'); window.scrollTo(0, y);
  }),
  sharePdf: async () => { const p = await get('projects', S.pid); shareFile(S.report.pdf, p.name); },
  dlPdf: () => download(S.report.pdf),
  logo: () => { readSettingsFields(); $('#logoIn').click(); },
  logoDel: async () => { readSettingsFields(); settings.logo = null; await put('kv', settings); render('settings'); },
  saveSettings: async () => { readSettingsFields(); await put('kv', settings); dropSample(); toast(t('settingsSaved')); },
  backup: b => busy(b, t('preparingCopy'), async () => { S.backupFile = await makeBackup(); readSettingsFields(); await render('settings'); window.scrollTo(0, document.body.scrollHeight); }),
  shareBackup: () => shareFile(S.backupFile, t('backupTitle')),
  dlBackup: () => download(S.backupFile),
  restore: () => $('#backupIn').click(),
  sample: b => busy(b, t('creatingSample'), async () => {
    dropSample();
    S.samplePdf = await makeSamplePdf();
    S.sampleUrl = URL.createObjectURL(S.samplePdf);
    $('#sampleBtns').innerHTML = sampleLinks();
  }),
  dlSample: () => download(S.samplePdf)
};
/* the sample follows the report language, so rebuild it after settings change */
function dropSample() { if (S.sampleUrl) URL.revokeObjectURL(S.sampleUrl); S.sampleUrl = S.samplePdf = null; }
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
app.addEventListener('input', e => {
  if (e.target.id === 'summary' && S.report) {
    S.report.summary = e.target.value;
    if (S.report.pdf) { S.report.pdf = null; $('.done')?.remove(); $('#barIn').innerHTML = reportBar(); }
  }
});
app.addEventListener('change', async e => {
  if ((e.target.id === 'dFrom' || e.target.id === 'dTo') && S.report) {
    S.report[e.target.id === 'dFrom' ? 'from' : 'to'] = e.target.value; S.report.pdf = null; render('report');
  }
  if (e.target.id === 'sUiLang') {
    readSettingsFields(); settings.uiLang = e.target.value; await put('kv', settings);
    const y = window.scrollY; await render('settings'); window.scrollTo(0, y);
  }
});
const onFiles = input => {
  const files = [...input.files]; input.value = '';
  if (files.length) go('add', { queue: files, qi: 0 });
};
$('#camIn').addEventListener('change', e => onFiles(e.target));
$('#galIn').addEventListener('change', e => onFiles(e.target));
$('#logoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { settings.logo = await resize(await loadImg(f), 480, 0.92, 'image/png'); await put('kv', settings); render('settings'); }
  catch (err) { toast(t('badImage')); }
});
$('#backupIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); });

/* ---------- start ---------- */
(async () => {
  try { settings = { ...DEFAULTS, ...((await get('kv', 'settings')) || {}) }; } catch (e) {}
  history.replaceState({ v: 'home' }, '');
  render('home');
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
})();
</script>
